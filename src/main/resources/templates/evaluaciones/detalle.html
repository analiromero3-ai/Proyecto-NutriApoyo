<!DOCTYPE html>
<html lang="es" xmlns:th="https://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Evaluar solicitud | NutriApoyo</title><link rel="stylesheet" th:href="@{/css/estilos.css}"></head>
<body><header class="barra-superior"><a class="logo" th:href="@{/inicio}">NutriApoyo</a><form th:action="@{/logout}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="boton-secundario" type="submit">Cerrar sesión</button></form></header>
<main class="contenido"><div class="cabecera-pagina"><div><p class="etiqueta" th:text="${solicitud.codigoSeguimiento}"></p><h1 th:text="${solicitud.beneficiario.nombreCompleto}"></h1></div><a class="boton-enlace secundario" th:href="@{/evaluaciones}">Volver</a></div>
<p class="alerta alerta-exito" th:if="${exito}" th:text="${exito}"></p><p class="alerta alerta-error" th:if="${error}" th:text="${error}"></p>
<dl class="detalle"><div><dt>Estado</dt><dd th:text="${solicitud.estado.nombreVisible}"></dd></div><div><dt>Documento</dt><dd th:text="${solicitud.beneficiario.numeroDocumento ?: 'No registrado'}"></dd></div><div><dt>Hemoglobina declarada</dt><dd th:text="${solicitud.nivelHemoglobina ?: 'No declarada'}"></dd></div><div><dt>Fecha de medición</dt><dd th:text="${solicitud.fechaMedicion != null ? #temporals.format(solicitud.fechaMedicion, 'dd/MM/yyyy') : 'No declarada'}"></dd></div><div><dt>Establecimiento</dt><dd th:text="${solicitud.establecimientoSalud ?: 'No declarado'}"></dd></div><div><dt>Condición declarada</dt><dd th:text="${solicitud.condicionAnemia != null ? solicitud.condicionAnemia.nombreVisible : 'No declarada'}"></dd></div><div class="ancho-completo"><dt>Observaciones de la solicitud</dt><dd th:text="${solicitud.observacionesSolicitud ?: 'Sin observaciones'}"></dd></div></dl>
<p class="nota">La decisión corresponde al evaluador. El sistema no realiza diagnóstico ni ajuste clínico automático.</p>
<a class="boton-enlace secundario" th:if="${solicitud.documentoRespaldo}" th:href="@{/evaluaciones/{id}/documento(id=${solicitud.id})}" target="_blank">Ver documento de respaldo</a>
<form class="formulario-beneficiario" th:if="${solicitud.estado.name() == 'RECIBIDA'}" th:action="@{/evaluaciones/{id}/iniciar(id=${solicitud.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button type="submit">Iniciar evaluación</button></form>
<form class="formulario-beneficiario" th:if="${solicitud.estado.name() == 'EN_EVALUACION'}" th:action="@{/evaluaciones/{id}/decision(id=${solicitud.id})}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div class="rejilla-formulario"><div class="grupo-formulario"><label for="decision">Decisión</label><select id="decision" name="decision" required><option value="">Seleccione</option><option th:each="item : ${decisiones}" th:value="${item}" th:text="${item.nombreVisible}"></option></select></div><div class="grupo-formulario ancho-completo"><label for="motivo">Motivo de la decisión *</label><textarea id="motivo" name="motivo" required maxlength="1000" rows="4"></textarea></div></div><button type="submit">Registrar decisión</button></form>
</main></body></html>
