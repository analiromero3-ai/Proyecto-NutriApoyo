<!DOCTYPE html>
<html lang="es" xmlns:th="https://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Evaluaciones | NutriApoyo</title><link rel="stylesheet" th:href="@{/css/estilos.css}"></head>
<body><header class="barra-superior"><a class="logo" th:href="@{/inicio}">NutriApoyo</a><form th:action="@{/logout}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="boton-secundario" type="submit">Cerrar sesión</button></form></header>
<main class="contenido"><div class="cabecera-pagina"><div><p class="etiqueta">Gestión interna</p><h1>Bandeja de evaluación</h1></div></div>
<form class="filtros filtros-cortos" th:action="@{/evaluaciones}" method="get"><div class="campo"><label for="estado">Estado</label><select id="estado" name="estado"><option value="">Todos</option><option th:each="item : ${estados}" th:value="${item}" th:text="${item.nombreVisible}" th:selected="${item == estadoSeleccionado}"></option></select></div><button type="submit">Filtrar</button></form>
<div class="vacio" th:if="${#lists.isEmpty(solicitudes)}">No hay solicitudes para los criterios seleccionados.</div>
<div class="tabla-contenedor" th:unless="${#lists.isEmpty(solicitudes)}"><table class="tabla-datos"><thead><tr><th>Código</th><th>Menor</th><th>Estado</th><th>Fecha</th><th></th></tr></thead><tbody><tr th:each="solicitud : ${solicitudes}"><td th:text="${solicitud.codigoSeguimiento}"></td><td th:text="${solicitud.beneficiario.nombreCompleto}"></td><td th:text="${solicitud.estado.nombreVisible}"></td><td th:text="${#temporals.format(solicitud.fechaSolicitud, 'dd/MM/yyyy HH:mm')}"></td><td><a th:href="@{/evaluaciones/{id}(id=${solicitud.id})}">Evaluar</a></td></tr></tbody></table></div>
</main></body></html>
