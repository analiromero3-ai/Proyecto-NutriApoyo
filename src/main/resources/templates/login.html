<!DOCTYPE html>
<html lang="es" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar | NutriApoyo</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="pagina-acceso">
<main class="tarjeta-acceso">
    <div class="marca">
        <span class="marca-icono" aria-hidden="true">♥</span>
        <div><strong>NutriApoyo</strong><small>Gestión de apoyo nutricional</small></div>
    </div>
    <h1>Bienvenido</h1>
    <p class="texto-secundario">Ingresa con tus credenciales institucionales.</p>

    <p class="alerta alerta-error" th:if="${param.error}">Correo o contraseña incorrectos, o la cuenta está inactiva.</p>
    <p class="alerta alerta-exito" th:if="${param.salida}">Tu sesión se cerró correctamente.</p>

    <form th:action="@{/login}" method="post" class="formulario-acceso">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label for="username">Correo electrónico</label>
        <input id="username" name="username" type="email" autocomplete="username" required autofocus>

        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit">Ingresar</button>
    </form>
</main>
</body>
</html>
