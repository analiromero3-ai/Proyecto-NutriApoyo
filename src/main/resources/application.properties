spring.application.name=NutriApoyo

spring.datasource.url=${NUTRIAPOYO_DB_URL:jdbc:mysql://localhost:3306/nutriapoyo?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${NUTRIAPOYO_DB_USERNAME}
spring.datasource.password=${NUTRIAPOYO_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
server.port=8081

# Límite coherente con la validación de adjuntos de solicitudes.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
nutriapoyo.documentos.ruta=${NUTRIAPOYO_DOCUMENTOS_RUTA:./datos/documentos}

# La cuenta inicial solo se crea si se habilita explícitamente mediante variables de entorno.
nutriapoyo.usuario-inicial.habilitado=${NUTRIAPOYO_USUARIO_INICIAL_HABILITADO:false}
nutriapoyo.usuario-inicial.nombres=${NUTRIAPOYO_USUARIO_INICIAL_NOMBRES:}
nutriapoyo.usuario-inicial.apellidos=${NUTRIAPOYO_USUARIO_INICIAL_APELLIDOS:}
nutriapoyo.usuario-inicial.correo=${NUTRIAPOYO_USUARIO_INICIAL_CORREO:}
nutriapoyo.usuario-inicial.contrasena=${NUTRIAPOYO_USUARIO_INICIAL_CONTRASENA:}
